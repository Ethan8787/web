<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monkeytype | Offline mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <header class="topbar">
	    <div class = "logo">
		  <svg xmlns="http://www.w3.org/2000/svg" viewBox="-680 -1030 300 180" class="h-full fill-[currentColor] text-main transition-colors"><g><path d="M -430 -910 L -430 -910 C -424.481 -910 -420 -905.519 -420 -900 L -420 -900 C -420 -894.481 -424.481 -890 -430 -890 L -430 -890 C -435.519 -890 -440 -894.481 -440 -900 L -440 -900 C -440 -905.519 -435.519 -910 -430 -910 Z"></path><path d=" M -570 -910 L -510 -910 C -504.481 -910 -500 -905.519 -500 -900 L -500 -900 C -500 -894.481 -504.481 -890 -510 -890 L -570 -890 C -575.519 -890 -580 -894.481 -580 -900 L -580 -900 C -580 -905.519 -575.519 -910 -570 -910 Z "></path><path d="M -590 -970 L -590 -970 C -584.481 -970 -580 -965.519 -580 -960 L -580 -940 C -580 -934.481 -584.481 -930 -590 -930 L -590 -930 C -595.519 -930 -600 -934.481 -600 -940 L -600 -960 C -600 -965.519 -595.519 -970 -590 -970 Z"></path><path d=" M -639.991 -960.515 C -639.72 -976.836 -626.385 -990 -610 -990 L -610 -990 C -602.32 -990 -595.31 -987.108 -590 -982.355 C -584.69 -987.108 -577.68 -990 -570 -990 L -570 -990 C -553.615 -990 -540.28 -976.836 -540.009 -960.515 C -540.001 -960.345 -540 -960.172 -540 -960 L -540 -960 L -540 -940 C -540 -934.481 -544.481 -930 -550 -930 L -550 -930 C -555.519 -930 -560 -934.481 -560 -940 L -560 -960 L -560 -960 C -560 -965.519 -564.481 -970 -570 -970 C -575.519 -970 -580 -965.519 -580 -960 L -580 -960 L -580 -960 L -580 -940 C -580 -934.481 -584.481 -930 -590 -930 L -590 -930 C -595.519 -930 -600 -934.481 -600 -940 L -600 -960 L -600 -960 L -600 -960 L -600 -960 L -600 -960 L -600 -960 L -600 -960 L -600 -960 C -600 -965.519 -604.481 -970 -610 -970 C -615.519 -970 -620 -965.519 -620 -960 L -620 -960 L -620 -940 C -620 -934.481 -624.481 -930 -630 -930 L -630 -930 C -635.519 -930 -640 -934.481 -640 -940 L -640 -960 L -640 -960 C -640 -960.172 -639.996 -960.344 -639.991 -960.515 Z "></path><path d=" M -460 -930 L -460 -900 C -460 -894.481 -464.481 -890 -470 -890 L -470 -890 C -475.519 -890 -480 -894.481 -480 -900 L -480 -930 L -508.82 -930 C -514.99 -930 -520 -934.481 -520 -940 L -520 -940 C -520 -945.519 -514.99 -950 -508.82 -950 L -431.18 -950 C -425.01 -950 -420 -945.519 -420 -940 L -420 -940 C -420 -934.481 -425.01 -930 -431.18 -930 L -460 -930 Z "></path><path d="M -470 -990 L -430 -990 C -424.481 -990 -420 -985.519 -420 -980 L -420 -980 C -420 -974.481 -424.481 -970 -430 -970 L -470 -970 C -475.519 -970 -480 -974.481 -480 -980 L -480 -980 C -480 -985.519 -475.519 -990 -470 -990 Z"></path><path d=" M -630 -910 L -610 -910 C -604.481 -910 -600 -905.519 -600 -900 L -600 -900 C -600 -894.481 -604.481 -890 -610 -890 L -630 -890 C -635.519 -890 -640 -894.481 -640 -900 L -640 -900 C -640 -905.519 -635.519 -910 -630 -910 Z "></path><path d=" M -515 -990 L -510 -990 C -504.481 -990 -500 -985.519 -500 -980 L -500 -980 C -500 -974.481 -504.481 -970 -510 -970 L -515 -970 C -520.519 -970 -525 -974.481 -525 -980 L -525 -980 C -525 -985.519 -520.519 -990 -515 -990 Z "></path><path d=" M -660 -910 L -680 -910 L -680 -980 C -680 -1007.596 -657.596 -1030 -630 -1030 L -430 -1030 C -402.404 -1030 -380 -1007.596 -380 -980 L -380 -900 C -380 -872.404 -402.404 -850 -430 -850 L -630 -850 C -657.596 -850 -680 -872.404 -680 -900 L -680 -920 L -660 -920 L -660 -900 C -660 -883.443 -646.557 -870 -630 -870 L -430 -870 C -413.443 -870 -400 -883.443 -400 -900 L -400 -980 C -400 -996.557 -413.443 -1010 -430 -1010 L -630 -1010 C -646.557 -1010 -660 -996.557 -660 -980 L -660 -910 Z "></path></g></svg>
          <span>Monkeytype</span>
		</div>
        <div id="mode-bar" class="mode-bar" role="toolbar" aria-label="Test mode">
          <div class="seg" id="mode-tabs">
            <button type="button" class="seg-btn" data-mode="time">time</button>
            <button type="button" class="seg-btn" data-mode="words">words</button>
            <button type="button" class="seg-btn" data-mode="custom">custom</button>
          </div>
          <span class="mode-divider" aria-hidden="true"></span>
          <div class="seg" id="mode-options"></div>
        </div>
        <nav class="controls" aria-label="Test controls">
          <button type="button" id="settings-btn" class="ctrl-btn">Settings</button>
        </nav>
      </header>

      <main>
        <section id="test-view" class="view visible show" aria-label="Typing test">
          <div id="live-stats" aria-live="off">
		    <span id="live-progress" class="live-progress">0/10</span>
            <span id="live-wpm" class="live-wpm">0</span>
          </div>

          <div id="typing-area">
            <div id="words">
              <div id="caret"></div>
              <div id="words-inner"></div>
            </div>
            <input id="hidden-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Typing input">
          </div>
        </section>

        <section id="result-view" class="view" aria-label="Results">
          <div id="res-banner" class="res-banner reveal hidden" style="--i:0">
            <strong id="res-banner-title"></strong>
            <span id="res-banner-sub"></span>
          </div>

          <div class="res-hero">
            <div class="hero-stat reveal" style="--i:1">
              <div class="result-label">wpm</div>
              <div id="res-wpm" class="hero-value">0</div>
            </div>
            <div class="hero-stat reveal" style="--i:2">
              <div class="result-label">accuracy</div>
              <div id="res-acc" class="hero-value">0%</div>
            </div>
          </div>

          <div class="res-stats reveal" style="--i:3">
            <div><div class="stat-label">test</div><div id="res-mode" class="stat-value">-</div></div>
            <div><div class="stat-label">raw wpm</div><div id="res-raw" class="stat-value">0</div></div>
            <div title="correct / incorrect characters"><div class="stat-label">characters</div><div id="res-chars" class="stat-value">0 / 0</div></div>
            <div><div class="stat-label">time</div><div id="res-time" class="stat-value">0.0s</div></div>
          </div>

          <div class="res-actions reveal" style="--i:4">
            <button type="button" id="btn-next" class="primary-btn">Next test<kbd>enter</kbd></button>
            <button type="button" id="btn-repeat" class="ghost-btn">Repeat this test<kbd>r</kbd></button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel">
      <h2 id="modal-title">Settings</h2>

      <div class="setting-block">
        <div class="setting-head">
          <label for="s-anim">Animation speed</label>
          <div class="num-field">
            <input type="number" id="s-anim-num" min="0" max="1000" step="10" inputmode="numeric" aria-label="Animation duration in milliseconds">
            <span class="num-unit">ms</span>
          </div>
        </div>
        <input type="range" id="s-anim" min="0" max="1000" step="10">
        <div class="range-scale" aria-hidden="true">
          <span>Instant</span>
          <span>Slow</span>
        </div>
        <div class="preset-row" id="anim-presets" role="group" aria-label="Animation speed presets"></div>
        <div class="anim-preview" id="anim-preview" aria-hidden="true">
          <div class="anim-dot"></div>
        </div>
      </div>

      <div class="setting-row">
        <label for="c-bg">Background</label>
        <input type="color" id="c-bg">
      </div>
      <div class="setting-row">
        <label for="c-text">Text (untyped)</label>
        <input type="color" id="c-text">
      </div>
      <div class="setting-row">
        <label for="c-active">Active text</label>
        <input type="color" id="c-active">
      </div>
      <div class="setting-row">
        <label for="c-accent">Caret / Accent</label>
        <input type="color" id="c-accent">
      </div>
      <div class="setting-row">
        <label for="c-error">Error</label>
        <input type="color" id="c-error">
      </div>

      <div class="modal-actions">
        <button type="button" id="s-reset" class="ctrl-btn">Reset to defaults</button>
        <button type="button" id="s-close" class="primary-btn">Done</button>
      </div>
    </div>
  </div>

  <div id="custom-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="custom-title">
    <div class="modal-backdrop" id="custom-backdrop"></div>
    <div class="modal-panel">
      <h2 id="custom-title">Custom text</h2>
      <p class="modal-hint">Paste or write the text you want to practice. Words are split on spaces and line breaks.</p>
      <textarea id="custom-text" rows="7" spellcheck="false" aria-label="Custom text"></textarea>
      <div class="modal-actions">
        <span id="custom-count" class="modal-hint">0 words</span>
        <div class="action-group">
          <button type="button" id="custom-cancel" class="ctrl-btn">Cancel</button>
          <button type="button" id="custom-save" class="primary-btn">Start test</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
