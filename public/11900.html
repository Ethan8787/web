            margin-bottom: 30px;

        }

        .section-title {
            font-size: 1.2rem;

        }

        .question-card {
            border: 1px solid var(--border-color);

            padding: 20px;

        }

        .question-header {

            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 4px;
            border: 1px solid transparent;
            font-size: 0.95rem;
        }

        .option-item.correct {
            color: var(--correct-color);
            background-color: var(--correct-bg);
            border-color: #a5d6a7;
            font-weight: 600;
        }

        .answer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .copy-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {

        }

            color: #ffffff;
            border-color: #111111;

    function renderApp() {
        const app = document.getElementById('app');
        let html = `<h1>學科測驗題庫</h1>`;

        examData.forEach(sec => {
            html += `
                <div class="section-block">
                    <div class="section-title">${sec.sectionTitle}</div>
                </div>
            `;

            sec.questions.forEach(q => {
                const correctAnswerText = q.options[q.correctIndex];

                html += `
                    <div class="question-card">
                        <div class="question-header">
                            <div class="question-title">${q.title}</div>
                        </div>
                        <ul class="options-list">
                            ${q.options.map((opt, idx) => `
                                <li class="option-item ${idx === q.correctIndex ? 'correct' : ''}">
                                    <span>(${idx + 1}) ${opt}</span>
                                </li>
                            `).join('')}
                        </ul>
                        <div class="answer-footer">
                            <div>正確答案：<span style="color: var(--correct-color); font-weight: bold;">(${q.correctIndex + 1}) ${correctAnswerText}</span></div>
                        </div>
                    </div>
                `;
            });
        });

        app.innerHTML = html;
    }

    function copyText(btn, text) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.innerText;
            btn.innerText = '已複製！';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('copied');
            }, 1200);
        });
    }

    function escapeQuotes(str) {
        return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    renderApp();
</script>
