    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --border-color: #e0e0e0;
            --section-bg: #f8f9fa;
            --btn-bg: #ffffff;
            --btn-border: #cccccc;
            --btn-hover: #f0f0f0;
            --correct-color: #2e7d32;
            --correct-bg: #e8f5e9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 12px;
        }

        .section-block {
            background: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .question-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            background: #ffffff;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 4px;
            border: 1px solid transparent;
            font-size: 0.95rem;
        }

        .option-item.correct {
            color: var(--correct-color);
            background-color: var(--correct-bg);
            border-color: #a5d6a7;
            font-weight: 600;
        }

        .answer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .copy-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background-color: var(--btn-hover);
        }

        .copy-btn.copied {
            background-color: #111111;
            color: #ffffff;
            border-color: #111111;
        }

        .copy-btn.small {
            padding: 3px 8px;
            font-size: 0.78rem;
        }
    </style>
</head>

    function renderApp() {
        const app = document.getElementById('app');
        let html = `<h1>學科測驗題庫</h1>`;

        examData.forEach(sec => {
            html += `
                <div class="section-block">
                    <div class="section-title">${sec.sectionTitle}</div>
                </div>
            `;

            sec.questions.forEach(q => {
                const correctAnswerText = q.options[q.correctIndex];

                html += `
                    <div class="question-card">
                        <div class="question-header">
                            <div class="question-title">${q.title}</div>
                        </div>
                        <ul class="options-list">
                            ${q.options.map((opt, idx) => `
                                <li class="option-item ${idx === q.correctIndex ? 'correct' : ''}">
                                    <span>(${idx + 1}) ${opt}</span>
                                </li>
                            `).join('')}
                        </ul>
                        <div class="answer-footer">
                            <div>正確答案：<span style="color: var(--correct-color); font-weight: bold;">(${q.correctIndex + 1}) ${correctAnswerText}</span></div>
                        </div>
                    </div>
                `;
            });
        });

        app.innerHTML = html;
    }

    function copyText(btn, text) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.innerText;
            btn.innerText = '已複製！';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('copied');
            }, 1200);
        });
    }

    function escapeQuotes(str) {
        return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    renderApp();
